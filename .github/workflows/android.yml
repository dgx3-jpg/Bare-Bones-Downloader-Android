name: Android debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: 'Run opt-in public YouTube audio/video + SAF integration'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Cache Robolectric runtime
        uses: actions/cache@v4
        with:
          path: app/build/test-home/.m2/repository
          key: robolectric-4.16.1-api35-i7
      - name: Keep debug signing identity between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bare-bones-android-debug-signing-v1
      - name: Install pinned Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test and build APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Publish sideloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
  native-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Allow runner access to KVM
        run: sudo setfacl -m u:$(id -un):rw /dev/kvm
      - name: Native runtime, process cancellation and real audio/video integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -memory 2048
          script: bash tools/run-native-tests.sh '${{ inputs.live }}'
      - name: Publish native verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-integration-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            native-logcat.txt
