name: Android debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: 'Opt-in public YouTube verification'
        type: boolean
        default: false
      tiktok:
        description: 'Opt-in public TikTok verification'
        type: boolean
        default: false
      release_tag:
        description: 'Verify and publish signed APK assets from this release tag; blank runs source verification'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
    env:
      BBD_DEBUG_KEYSTORE_PATH: /tmp/bbd-signing/debug.keystore
      BBD_RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Cache Robolectric runtime
        uses: actions/cache@v4
        with:
          path: app/build/test-home/.m2/repository
          key: robolectric-4.16.1-api35-i7
      - name: Configure signing without caching private keys
        id: signing
        env:
          BBD_DEBUG_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.BBD_DEBUG_KEYSTORE_BASE64 || '' }}
        run: python3 tools/verify-signing.py
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test, lint and assemble source
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PbbdSourceCommit="$(git rev-parse HEAD)"
      - name: Fetch and verify offline-signed release
        if: inputs.release_tag != ''
        run: |
          gh release download "$BBD_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern app-debug.apk --pattern update-verification-apks.zip --pattern release-manifest.json --dir signed-apks
          python3 tools/verify-release.py signed-apks
      - name: Publish verified signed release APK
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            signed-apks/app-debug.apk
            signed-apks/release-manifest.json
          if-no-files-found: error
      - name: Publish directly signed CI APK
        if: inputs.release_tag == '' && steps.signing.outputs.mode == 'permanent'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$BBD_DEBUG_KEYSTORE_PATH"
  native-integration:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BBD_DEBUG_KEYSTORE_PATH: /tmp/bbd-signing/debug.keystore
      BBD_RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Configure isolated test signing
        env:
          BBD_DEBUG_KEYSTORE_BASE64: ${{ secrets.BBD_DEBUG_KEYSTORE_BASE64 }}
        run: python3 tools/verify-signing.py
      - name: Fetch actual permanent-key APKs for upgrade verification
        if: inputs.release_tag != ''
        run: |
          gh release download "$BBD_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern app-debug.apk --pattern update-verification-apks.zip --pattern release-manifest.json --dir signed-apks
          python3 tools/verify-release.py signed-apks
      - name: Allow runner access to KVM
        run: sudo setfacl -m u:$(id -un):rw /dev/kvm
      - name: Test real APK update, native media, SAF and background execution
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -memory 2048
          script: bash tools/run-native-tests.sh '${{ inputs.live }}' '${{ inputs.tiktok }}'
      - name: Publish native verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-integration-reports
          path: |
            app/build/outputs/native-test-results/
            native-runner.log
            native-logcat.txt
            theme-*-scaled.png
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$BBD_DEBUG_KEYSTORE_PATH"
